name: workflow-metadata
description: "Compute workflow metadata"

outputs:
  type:
    description: Workflow type. One of 'PR', 'main', or 'release'
    value: ${{ steps.workflow.outputs.type }}
  fork-pr:
    description: "'true' if the run is a pull request from a fork, 'false' otherwise"
    value: ${{ steps.workflow.outputs.fork-pr }}
  version-raw:
    description: Raw version
    value: ${{ steps.versions.outputs.raw }}
  version-latest:
    description: Latest version
    value: ${{ steps.versions.outputs.latest }}
  version-chart:
    description: Latest chart version
    value: ${{ steps.versions.outputs.chart }}

runs:
  using: composite

  steps:
    - name: Setup environment
      uses: ./.github/actions/setup-env

    - id: workflow
      shell: bash
      run: |
        # Compute workflow type
        case '${{ github.event_name }}' in
          pull_request)
            TYPE=PR
            ;;
          push)
            case '${{ github.ref }}' in
              refs/heads/main)
                TYPE=main
                ;;
              refs/tags/*)
                TYPE=release
                ;;
              *)
              echo "unknown push ref '${{ github.ref }}'" >&2
              exit 1
              ;;
            esac
            ;;
          *)
            echo "unknown event name '${{ github.event_name }}'" >&2
            exit 1
            ;;
        esac

        echo "type=${TYPE}" | tee --append "${GITHUB_OUTPUT}"

        # Only a pull_request can be a fork PR, and 'github.event.pull_request' is absent
        # for every other event, so gate on TYPE before touching that metadata.
        if [ "${TYPE}" = 'PR' ] && \
           [ '${{ github.event.pull_request.head.repo.full_name }}' != '${{ github.repository }}' ]; then
          FORK_PR=true
        else
          FORK_PR=false
        fi
        echo "fork-pr=${FORK_PR}" | tee --append "${GITHUB_OUTPUT}"

    - id: versions
      shell: bash
      run: |
        # Compute versions
        RAW=$(uv run hatch version)
        echo "raw=${RAW}" | tee --append "${GITHUB_OUTPUT}"

        LATEST=$(git describe --tags --match "v[0-9]*.[0-9]*.[0-9]*" --abbrev=0| sed 's|^v||')
        echo "latest=${LATEST}" | tee --append "${GITHUB_OUTPUT}"

        CHART=$(git describe --tags --match "chart/v[0-9]*.[0-9]*.[0-9]*" --abbrev=0| sed 's|^chart/v||')
        echo "chart=${CHART}" | tee --append "${GITHUB_OUTPUT}"
