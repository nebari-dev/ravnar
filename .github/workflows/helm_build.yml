name: helm build

on:
  pull_request:
    paths:
      - ".github/**"
      - "helm/**"
  push:
    tags: ['chart/v[0-9]+\.[0-9]+\.[0-9]+']

concurrency:
  group: helm-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NAMESPACE: quay.io/nebari/charts

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      workflow-type: ${{ steps.workflow.outputs.type }}
      chart-version: ${{ steps.workflow.outputs.version-chart }}
      app-version: ${{ steps.workflow.outputs.version-latest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Compute workflow metadata
        id: workflow
        uses: ./.github/actions/workflow-metadata

  build-and-push:
    needs: metadata
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install mise and setup helm
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          mise_toml: |
            [tools]
            helm = "latest"

      - name: Patch helm chart
        uses: ./.github/actions/patch-helm-chart
        with:
          chart-version: ${{ needs.metadata.outputs.chart-version }}
          app-version: ${{ needs.metadata.outputs.app-version }}

      - name: Install chart dependencies
        run: helm dependencies update ./helm/ravnar

      - name: Package helm chart
        run: helm package ./helm/ravnar

      - name: Login to Quay.io
        if: ${{ needs.metadata.outputs.workflow-type == 'release' }}
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: quay.io
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      - name: Push helm chart
        if: ${{ needs.metadata.outputs.workflow-type == 'release' }}
        run: helm push 'ravnar-${{ needs.metadata.outputs.chart-version }}.tgz' 'oci://${{ env.NAMESPACE }}'
