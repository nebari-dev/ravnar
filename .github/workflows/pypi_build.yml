name: PyPI build

on:
  pull_request:
  push:
    tags: ['v[0-9]+\.[0-9]+\.[0-9]+']

jobs:
  pypi:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Compute workflow metadata
        id: metadata
        uses: ./.github/actions/workflow-metadata

      - name: Build binary and source distribution
        run: uv build

      - name: Publish to PyPI
        if: ${{ steps.metadata.outputs.type == 'release' }}
        run: uv publish --no-progress --trusted-publishing=always dist/*
